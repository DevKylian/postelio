    <line x1="184" y1="160" x2="184" y2="352" stroke="white" stroke-width="28" stroke-linecap="round"/>
    <line x1="256" y1="102" x2="256" y2="410" stroke="white" stroke-width="28" stroke-linecap="round"/>
    <line x1="328" y1="170" x2="328" y2="342" stroke="white" stroke-width="28" stroke-linecap="round"/>
